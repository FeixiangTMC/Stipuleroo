on:
  release:
    types:
      - published
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - client
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      # 26.40 客户端由 clang/LLVM 构建，模组必须用 clang-cl 编译（xmake.lua 里 set_toolchains("clang-cl")）
      - name: Ensure clang-cl is available
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            $dir = "$env:ProgramFiles\LLVM\bin"
            if (Test-Path "$dir\clang-cl.exe") { $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
          }
          clang-cl --version

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y

      - run: |
          xmake -w -y

      # 发布包里只需要可供玩家安装的两个文件；调试符号（.pdb，约 15MB）不进发布包
      - name: Drop debug symbols
        run: |
          Remove-Item "bin/Stipuleroo/*.pdb" -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    strategy:
      matrix:
        target_type:
          - client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: artifact

      # zip 内的资源名必须与 tooth.json 里声明的 URL 完全一致：
      #   Stipuleroo-Windows-v<version>-26.40.zip（tag 形如 v0.0.4）
      - name: Package release zip
        run: |
          cp CHANGELOG.md LICENSE README.md artifact/
          cd artifact
          zip -r "../Stipuleroo-Windows-${{ github.event.release.tag_name }}-26.40.zip" *

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            Stipuleroo-Windows-${{ github.event.release.tag_name }}-26.40.zip
